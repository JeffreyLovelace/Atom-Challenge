<div class="tasks-container">
  <div class="header">
    <h2>My Tasks</h2>
    <button (click)="logout()" class="btn-logout">Sign Out</button>
  </div>

  <div class="task-form">
    <h3>New Task</h3>
    <form (ngSubmit)="onSubmit()" #taskForm="ngForm">
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="newTask.title"
          required
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="newTask.description"
          required
          class="form-control"
        ></textarea>
      </div>
      <button
        type="submit"
        [disabled]="!taskForm.form.valid"
        class="btn-primary"
      >
        Add Task
      </button>
    </form>
  </div>

  <div class="tasks">
    <div *ngFor="let task of tasks" class="task-item">
      <div class="task-header">
        <h3>{{ task.title }}</h3>
        <div class="task-actions">
          <button (click)="toggleTaskStatus(task)" class="btn-status">
            {{
              task.status === "completed"
                ? "Pending"
                : task.status === "pending"
                ? "Completed"
                : "Set Status"
            }}
          </button>
          <button (click)="deleteTask(task.id)" class="btn-delete">
            Delete
          </button>
          <button (click)="startEditTask(task)" class="btn-edit">Edit</button>
        </div>
      </div>
      <p class="task-description">{{ task.description }}</p>
      <p class="task-date">Created: {{ task.createdAt | date : "medium" }}</p>

      <div *ngIf="editingTask && editingTask.id === task.id" class="edit-form">
        <form (ngSubmit)="saveEditTask()" #editForm="ngForm">
          <div class="form-group">
            <label for="editTitle">Title</label>
            <input
              id="editTitle"
              name="editTitle"
              [(ngModel)]="editingTask.title"
              required
              class="form-control"
            />
          </div>
          <div class="form-group">
            <label for="editDescription">Description</label>
            <textarea
              id="editDescription"
              name="editDescription"
              [(ngModel)]="editingTask.description"
              required
              class="form-control"
            ></textarea>
          </div>
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" (click)="cancelEditTask()" class="btn-delete">
            Cancel
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
